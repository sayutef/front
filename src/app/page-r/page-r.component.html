<app-header></app-header>

<div class="container">
    <div class="card">
        <div class="hora">{{ hora }}</div>
        
        <div class="top-section">
            <div class="circle">
                <img src="heartC.png">
                <h2 class="temp">{{ ritmoCardiaco }} BPM</h2>
            </div>
        </div>

        <div class="info">
            <h2 class="name">Pablo {{ nombre }}</h2>
            <h2 class="status">Ritmo cardiaco {{ status }}</h2>
        </div>

        <div class="nav-links">
            <a routerLink="/">Home</a>
            <a routerLink="/oxigeno">Oxígeno</a>
            <a routerLink="/heart">Ritmo cardíaco</a>
            <a routerLink="/Temperature">Temperatura</a>
        </div>
    </div>
</div>

<router-outlet></router-outlet>
